<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Calculadora de Férias SaaS</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="menu-global.css">
</head>
<body>
  <div class="container">
    <h1>💼 Calculadora de Férias</h1>
    <p class="subtitle">Plataforma SaaS para gestão de férias</p>

    <div class="tabs">
      <div class="tab active" onclick="showTab('login')">Login</div>
      <div class="tab" onclick="showTab('register')">Registrar</div>
    </div>

    <form id="loginForm" class="form active">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit">Entrar</button>
      <div class="error" id="loginError"></div>
    </form>

    <form id="registerForm" class="form">
      <div class="input-group">
        <label>Nome da Empresa</label>
        <input type="text" id="companyName" required>
      </div>
      <div class="input-group">
        <label>CNPJ</label>
        <input type="text" id="companyCnpj" placeholder="Apenas números ou com pontuação" required>
      </div>
      <div class="input-group">
        <label>Seu Nome</label>
        <input type="text" id="userName" required>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="registerEmail" required>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="registerPassword" required>
      </div>
      <button type="submit">Criar Conta (Plano Free)</button>
      <div class="error" id="registerError"></div>
      <div class="success" id="registerSuccess"></div>
    </form>
  </div>

  <script>
    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab + 'Form').classList.add('active');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.usuario));
          window.location.href = '/index.html';
        } else {
          errorDiv.textContent = data.erro;
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'Erro ao conectar com o servidor';
        errorDiv.style.display = 'block';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const companyName = document.getElementById('companyName').value;
      const cnpj = document.getElementById('companyCnpj').value;
      const name = document.getElementById('userName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const errorDiv = document.getElementById('registerError');
      const successDiv = document.getElementById('registerSuccess');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyName, cnpj, name, email, password })
        });

        const data = await res.json();

        if (res.ok) {
          successDiv.textContent = 'Conta criada! Faça login para continuar.';
          successDiv.style.display = 'block';
          errorDiv.style.display = 'none';
          setTimeout(() => showTab('login'), 2000);
        } else {
          errorDiv.textContent = data.erro;
          errorDiv.style.display = 'block';
          successDiv.style.display = 'none';
        }
      } catch (error) {
        errorDiv.textContent = 'Erro ao conectar com o servidor';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
