<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Calculadora de Férias SaaS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
    h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
    .tabs { display: flex; margin-bottom: 30px; border-bottom: 2px solid #eee; }
    .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: #667eea; border-bottom-color: #667eea; font-weight: bold; }
    .form { display: none; }
    .form.active { display: block; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; color: #333; font-size: 14px; font-weight: 500; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
    input:focus { outline: none; border-color: #667eea; }
    button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #5568d3; }
    .error { color: #e74c3c; font-size: 14px; margin-top: 10px; display: none; }
    .success { color: #27ae60; font-size: 14px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💼 Calculadora de Férias</h1>
    <p class="subtitle">Plataforma SaaS para gestão de férias</p>

    <div class="tabs">
      <div class="tab active" onclick="showTab('login')">Login</div>
      <div class="tab" onclick="showTab('register')">Registrar</div>
    </div>

    <form id="loginForm" class="form active">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit">Entrar</button>
      <div class="error" id="loginError"></div>
    </form>

    <form id="registerForm" class="form">
      <div class="input-group">
        <label>Nome da Empresa</label>
        <input type="text" id="companyName" required>
      </div>
      <div class="input-group">
        <label>CNPJ</label>
        <input type="text" id="companyCnpj" placeholder="Apenas números ou com pontuação" required>
      </div>
      <div class="input-group">
        <label>Seu Nome</label>
        <input type="text" id="userName" required>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="registerEmail" required>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="registerPassword" required>
      </div>
      <button type="submit">Criar Conta (Plano Free)</button>
      <div class="error" id="registerError"></div>
      <div class="success" id="registerSuccess"></div>
    </form>
  </div>

  <script>
    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab + 'Form').classList.add('active');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.usuario));
          window.location.href = '/index.html';
        } else {
          errorDiv.textContent = data.erro;
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'Erro ao conectar com o servidor';
        errorDiv.style.display = 'block';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const companyName = document.getElementById('companyName').value;
      const cnpj = document.getElementById('companyCnpj').value;
      const name = document.getElementById('userName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const errorDiv = document.getElementById('registerError');
      const successDiv = document.getElementById('registerSuccess');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyName, cnpj, name, email, password })
        });

        const data = await res.json();

        if (res.ok) {
          successDiv.textContent = 'Conta criada! Faça login para continuar.';
          successDiv.style.display = 'block';
          errorDiv.style.display = 'none';
          setTimeout(() => showTab('login'), 2000);
        } else {
          errorDiv.textContent = data.erro;
          errorDiv.style.display = 'block';
          successDiv.style.display = 'none';
        }
      } catch (error) {
        errorDiv.textContent = 'Erro ao conectar com o servidor';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
